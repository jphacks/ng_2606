<?xml version="1.0" encoding="UTF-8"?>
<!-- たかさものさし（実物大の下書き）。1単位 = 1mm。印刷するときは「実際のサイズ（100%）」で。
     値は Docs/StepRules.md：0.8cm まで あるける、0.8〜4.5cm ジャンプで のれる、4.5cm より上 たかすぎる。キャラの身長 3cm。
     担当：D（D_ui.md Step 9）。C の Docs/HeightGauge.md ができたら、それに合わせて直す。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="70mm" height="130mm" viewBox="0 0 70 130">
  <style>
    text { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
    .label { font-size: 3.6px; font-weight: bold; }
    .tick { font-size: 2.4px; fill: #555; }
  </style>
  <rect x="0" y="0" width="70" height="130" fill="#ffffff"/>

  <!-- 下の「おる」ところ（ここで折って立てる）。ものさしの 0 は折り目 -->
  <rect x="4" y="110" width="62" height="16" fill="#f3f3f3" stroke="#bbb" stroke-width="0.3"/>
  <line x1="4" y1="110" x2="66" y2="110" stroke="#888" stroke-width="0.4" stroke-dasharray="1.5 1"/>
  <text x="35" y="119.5" class="tick" text-anchor="middle">ここで おって たてる</text>

  <!-- 帯：0〜0.8cm 灰、0.8〜4.5cm 緑、4.5〜8cm 赤（下から上へ） -->
  <rect x="6" y="102" width="22" height="8" fill="#b3b3b3"/>
  <rect x="6" y="65" width="22" height="37" fill="#66c766"/>
  <rect x="6" y="30" width="22" height="35" fill="#eb5c52"/>
  <rect x="6" y="30" width="22" height="80" fill="none" stroke="#333" stroke-width="0.4"/>

  <!-- 1cm ごとの目盛り -->
  <g stroke="#333" stroke-width="0.3">
    <line x1="28" y1="100" x2="31" y2="100"/>
    <line x1="28" y1="90" x2="31" y2="90"/>
    <line x1="28" y1="80" x2="31" y2="80"/>
    <line x1="28" y1="70" x2="31" y2="70"/>
    <line x1="28" y1="60" x2="31" y2="60"/>
    <line x1="28" y1="50" x2="31" y2="50"/>
    <line x1="28" y1="40" x2="31" y2="40"/>
    <line x1="28" y1="30" x2="31" y2="30"/>
  </g>
  <g class="tick">
    <text x="32" y="100.8">1</text>
    <text x="32" y="90.8">2</text>
    <text x="32" y="80.8">3</text>
    <text x="32" y="70.8">4</text>
    <text x="32" y="60.8">5</text>
    <text x="32" y="50.8">6</text>
    <text x="32" y="40.8">7</text>
    <text x="32" y="30.8">8cm</text>
  </g>

  <!-- 帯の中の文字と絵（色だけで伝えないよう、文字と記号もつける） -->
  <text x="17" y="107.3" class="label" text-anchor="middle" font-size="3px">→ あるける</text>
  <text x="17" y="82" class="label" text-anchor="middle">↑</text>
  <text x="17" y="87" class="label" text-anchor="middle">ジャンプで</text>
  <text x="17" y="91.5" class="label" text-anchor="middle">のれる</text>
  <text x="17" y="45" class="label" text-anchor="middle" fill="#fff">✕</text>
  <text x="17" y="50" class="label" text-anchor="middle" fill="#fff">たかすぎる</text>

  <!-- 実物大のキャラ（身長3cm）。足は折り目の上 -->
  <g transform="translate(50 110)">
    <rect x="-4" y="-20" width="8" height="20" rx="3" fill="#ff9933" stroke="#a65c00" stroke-width="0.4"/>
    <circle cx="0" cy="-25" r="5" fill="#ff9933" stroke="#a65c00" stroke-width="0.4"/>
    <circle cx="1.8" cy="-26" r="0.8" fill="#333"/>
    <circle cx="-1.8" cy="-26" r="0.8" fill="#333"/>
  </g>
  <line x1="44" y1="80" x2="56" y2="80" stroke="#a65c00" stroke-width="0.3" stroke-dasharray="1 0.8"/>
  <text x="50" y="78" class="tick" text-anchor="middle">キャラ 3cm</text>

  <text x="35" y="12" class="label" text-anchor="middle" font-size="5px">たかさ ものさし</text>
  <text x="35" y="19" class="tick" text-anchor="middle">ものの よこに たてて みてね</text>
</svg>
